[project]
name = "thwake"
version = "0.1.0"
description = "Remote sensing monitor: independent satellite record of Thwake Dam reservoir (Kenya): filling, water-quality signals and regional change."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click==8.5.0",
    "earthengine-api==1.7.47",
    "geemap==0.37.2",
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.scripts]
thwake = "thwake.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thwake"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=thwake --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["thwake"]

[tool.mypy]
python_version = "3.11"
files = ["src/thwake"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# Earth Engine / geemap / geopandas ship without type stubs.
module = ["ee", "ee.*", "geemap", "geemap.*", "geopandas", "geopandas.*", "shapely", "shapely.*"]
ignore_missing_imports = true
