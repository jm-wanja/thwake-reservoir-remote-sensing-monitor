[project]
name = "thwake"
version = "0.1.0"
description = "Remote sensing monitor: independent satellite record of Thwake Dam reservoir (Kenya): filling, water-quality signals and regional change."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# License: not chosen yet — see .ai/docs/08-open-questions.md #12.
dependencies = [
    "click==8.5.0",
    "earthengine-api==1.7.47",
    "geemap==0.37.2",
    "geopandas==1.2.0",
    "pandas==3.0.6",
    "python-dotenv==1.2.4",
    "pyyaml==6.0.3",
]

[project.scripts]
thwake = "thwake.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thwake"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
