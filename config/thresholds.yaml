# Algorithm parameters. Starting values from docs/methodology.md.
# null = not specified in the methodology yet; to be set (and justified) in the prompt
# that implements it. Changes after Phase 2 starts need an ADR.

baseline:
  aev_level_step_m: 0.5            # methodology §1.3
  # AEV curve (methodology §1.3), set in prompt 04.
  aev_dems: [copernicus_glo30, srtm]  # primary first; both use the same GLO-30 max-extent mask
  aev_capacity_check_pct: 20       # warn if volume at FSL differs from design capacity by more
  aev_wall_zone_m: 500             # DEM-difference statistics also reported within this distance
                                   # of the wall axis (checks for artefacts near the dam site)
  aoi_buffer_above_fsl_m: 5        # methodology §1.1 ("e.g. +5 m")
  # Max extent and AOI (methodology §1.1–1.2), set in prompt 03.
  search_radius_km: 20             # half-width of the square searched around the wall; the
                                   # outputs must not touch its edge (reservoir ~12 km long)
  eight_connected: true            # 8-neighbour flood fill so 1-pixel diagonal channels connect
  wall_barrier_half_width_m: 45    # wall burned into the pre-dam DEM as a 90 m (3-pixel) strip,
                                   # too wide for an 8-connected fill to step through diagonally
  abutment_extension_m: 300        # extend the digitised axis into the abutment hills, so the
                                   # barrier ends on ground above the AOI level
  pass_closure_radius_m: 150       # AOI only: disk that closes a rim overflow pass (saddle)
  pass_level_tolerance_m: 0.1      # precision of the overflow-level search
  max_pass_closures: 10            # stop with an error rather than close passes indefinitely
  # Pre-filling reference layers (methodology §1.4), set in prompt 05.
  composite_cloud_score_min: 0.6   # Cloud Score+ 'cs' ≥ this is clear; as used for the wall
                                   # digitising composite (prompt 03). Independent of the Phase 2
                                   # sentinel2.cloud_score_plus_threshold (prompt 06)
  composite_bands: [B2, B3, B4, B8, B11, B12]  # blue, green, red, NIR, SWIR1, SWIR2: true colour
                                   # plus what MNDWI/NDVI need; stored as uint16 reflectance ×10⁴
  composite_scale_m: 10            # native S2 resolution (B11/B12 resampled from 20 m)
  composite_buffer_m: 1000         # around the AOI bounding box, so the wall and the river
                                   # just downstream are in the frame
  composite_png_px: 1200           # longest side of media/before_composite.png (~12 m/pixel)
  # JRC occurrence = % of valid observations 1984–2021 with water. The Athi here is a narrow,
  # seasonal river, so 30 m pixels are mixed and occurrence never exceeds ~60% in the AOI
  # (≥50% keeps only 0.02 km²). 10% traces the channel without the isolated low-occurrence
  # specks of ≥5%. Areas at the sensitivity levels are reported with the output.
  river_occurrence_min_pct: 10
  river_occurrence_sensitivity_pct: [5, 25, 50]
  landcover_area_tolerance_pct: 2  # class areas (pixel centres in the mask) must sum to the
                                   # max-extent polygon area within this; more means gaps

sentinel2:
  water_index: MNDWI               # methodology §2.1; NDWI computed for comparison
  threshold_method: otsu
  fallback_threshold: 0.0          # methodology §2.1 ("~0")
  min_valid_fraction: 0.7          # methodology §2.1 ("e.g. 0.7") → qa_flag low_coverage
  # Set in prompt 05a (validation), before any comparison was run; not tuned to Masinga.
  cloud_score_plus_threshold: 0.6  # Cloud Score+ 'cs' ≥ this is clear; same value as the
                                   # baseline composite (Google's suggested 0.5–0.65 range)
  otsu_valid_range: [-0.5, 0.5]    # an Otsu MNDWI threshold outside this is implausible
                                   # (water/land splits sit near 0) → use fallback_threshold
  histogram_range: [-1.0, 1.0]     # MNDWI histogram for Otsu: full index range,
  histogram_bin_width: 0.01        # 200 bins
  histogram_scale_m: 20            # native B11 (SWIR1) resolution; the mask itself is 10 m

sentinel1:
  instrument_mode: IW
  polarisation: VV
  threshold_method: otsu
  fixed_threshold_db: -18.0        # methodology §2.2 (GERD studies reference value)
  # Set in prompt 05a (validation), before any comparison was run; not tuned to Masinga.
  speckle_filter: focal_median     # simplest filter in methodology §2.2; refined Lee may be
                                   # compared in Phase 2 (prompt 06)
  speckle_filter_radius_m: 50      # 5 pixels at 10 m; keeps ~100 m wide inlets
  otsu_valid_range: [-25.0, -12.0] # an Otsu VV threshold outside this is implausible
                                   # (calm water ≈ −20 dB and below, land ≈ −12 to −5 dB)
  histogram_range: [-35.0, 5.0]    # VV histogram for Otsu (dB),
  histogram_bin_width: 0.1         # 400 bins
  histogram_scale_m: 20            # coarser than the 10 m mask; enough pixels for a histogram
  max_slope_deg: null              # radar-shadow / steep-slope mask — set in prompt 06

postprocess:
  min_component_area_m2: null      # remove isolated specks — set in prompt 06

uncertainty:
  otsu_margin: null                # threshold sensitivity ± margin — set in prompt 07
  edge_ring_pixels: 0.5            # methodology §2.5 (± half a pixel ring)

qa:
  sensor_pair_window_days: 2       # methodology §2.6 (±2 days)
  sensor_disagree_pct: null        # methodology §2.6 ("X%") — set in prompt 07

validation:
  # Reference-reservoir validation (prompt 05a, docs/validation.md). Fixed before any
  # comparison was run; never adjusted to improve agreement (ADR 0009).
  otsu_buffer_m: 1000              # Otsu histogram region = max extent + this land ring,
                                   # so the histogram has both classes even when full
  match_window_days: 6             # a scene within this many days of a published date
                                   # is compared with it (half the 12-day Sentinel-1A
                                   # repeat); the gap is reported
  rapid_change_m_per_day: 0.04     # flag matches where the level moves this fast: over
                                   # the 6-day match window that is ≥ 0.24 m, about half a
                                   # 0.5 m curve step (set 2026-10-10, before the DAHITI run)
  dem_water_surface_min_share: 0.1 # a single DEM elevation covering ≥ this share of the
                                   # mask is the water surface captured by the DEM (flat);
                                   # no level below it can be estimated
