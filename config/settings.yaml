# Project settings. Facts come from data/external/official_figures.csv (with sources).
# Values marked ⚠️ verify are unconfirmed — see docs/open-questions.md.
# FSL, design capacity and maximum flood level are human-verified (dam.design_figures_verified);
# the dam axis was human-verified on imagery (open question 1).

dam:
  name: Thwake Dam
  river: Athi River (confluence with Thwake River)
  counties: [Makueni, Kitui]
  # ESIA May 2025 §2.4 (current SMEC 2018 design). Open question 2 (resolved).
  full_supply_level_m_asl: 912
  # Current design capacity at FSL (ESIA 2025; Ministry ToRs 2020, 2024). Used for pct_full.
  # Earlier designs gave 681 and 825 MCM at the same FSL — see open questions 3 and 15.
  design_capacity_mcm: 688
  # ESIA 2025 §2.4. Labelled as crest elevation by another source — open question 16.
  maximum_flood_level_m_asl: 920.5
  # The author checked FSL, capacity, freeboard and maximum flood level against the ESIA
  # (human-steps.md H6). Recorded in the baseline outputs' FSL provenance.
  design_figures_verified:
    date: 2026-10-10
    source: >-
      ESIA May 2025 §2.4 "New Design Parameters" (reservoir storage 688 MCM, FSL 912 m a.s.l.,
      freeboard 8.5 m, maximum flood level 920.5 m) and §2.3 ("the contour line 912 MASl
      represents this volume")
  # Dam axis DIGITISED (not a published value) on 2026-10-09 (prompt 03) from a
  # Sentinel-2 L2A median composite (Jun–Sep 2026, Cloud Score+ ≥ 0.6): the visible ends of
  # the embankment crest, read to about ±20 m. Length ≈1.48 km (ESIA: crest 1,500 m).
  # Midpoint ≈ -1.7893, 37.8451, ~110 m from the prompt 01 estimate. Human-verified on
  # Google Earth imagery of 25 Jun 2024 (open question 1, resolved 2026-10-09).
  # SW (Makueni) end first, NE (Kitui) end second.
  wall_axis:
    - {lat: -1.79363, lon: 37.84005}
    - {lat: -1.78505, lon: 37.85021}
  wall_axis_source: >-
    Digitised 2026-10-09 (prompt 03) on a Sentinel-2 L2A median composite, Jun–Sep 2026;
    not a published value. Human-verified on Google Earth imagery of 25 Jun 2024 (open
    question 1, resolved).
  # Flood-fill start for the max-extent mask: the Athi–Thwake confluence (OpenStreetMap;
  # see official_figures.csv), ~1 km upstream of the wall and on the pre-dam river bed.
  reservoir_seed: {lat: -1.78099, lon: 37.84029}
  # A point on the Athi channel ~2.5 km downstream of the wall (digitised on the same
  # composite). The max extent and AOI must never reach it; used to detect rim leaks.
  downstream_check_point: {lat: -1.81, lon: 37.86}

dates:
  # Contractor site handover = commencement (Ministry ToR, Oct 2024). Both DEMs predate it.
  construction_start: 2018-03-27
  # ⚠️ verify: impoundment has not started as of 2026-10-09; official target is end of
  # January 2027 (a projection, not an event). Set the actual date + source when it happens.
  # Open question 5.
  impoundment_start: null
  # Pre-filling reference window (methodology §1.4, prompt 05): the latest long dry season
  # before impoundment. Jun–Sep is the main dry season around Thwake (Makindu WMO normals:
  # ≤2 mm/month Jun–Sep); the CHIRPS total for the window is recorded with the composite.
  # Used for the Sentinel-2 "before" composite and Dynamic World land cover. End exclusive.
  pre_filling_window: {start: 2026-06-01, end: 2026-10-01}

paths:
  # Relative to the repository root.
  aoi: data/baseline/aoi.geojson
  max_extent: data/baseline/max_extent.geojson
  aev_curve: data/baseline/aev_curve_v1.csv
  aev_metadata: data/baseline/aev_curve_v1.json   # provenance + checks for the CSV
  aev_figure: media/aev_curve_v1.png
  # Pre-filling reference layers (prompt 05).
  landcover: data/baseline/landcover_flood_zone.csv
  landcover_metadata: data/baseline/landcover_flood_zone.json
  river_channel: data/baseline/river_channel.geojson
  before_composite_png: media/before_composite.png
  before_composite_metadata: data/baseline/before_composite.json  # provenance of the asset + PNG
  # SHA-256 of every frozen baseline file (the path keys in baseline.FROZEN_PATH_KEYS).
  # Its presence means the baseline is frozen: `thwake baseline` refuses to overwrite it.
  baseline_manifest: data/baseline/baseline_v1.sha256
  timeseries: data/processed/thwake_timeseries.csv
  official_figures: data/external/official_figures.csv

earth_engine:
  # The Cloud project ID is read from EE_PROJECT in .env, never stored here.
  # Cloud assets folder for baseline layers (created 2026-10-09, human-steps.md H2).
  assets_folder: projects/thwake-monitor/assets/thwake
  # Sentinel-2 "before" composite (prompt 05), versioned with the baseline.
  before_composite_asset: projects/thwake-monitor/assets/thwake/before_composite_s2_v1
  # Compute budget (AGENTS.md rule 11). Community tier = 540,000 EECU-seconds/month
  # (150 EECU-hours), no billing account; exceeding it puts the project in restricted mode
  # (no charges, work pauses until the monthly reset). Usage alert at 80% set up 2026-10-10.
  # Reference cost: one full Masinga validation run (Dec 2018-Sep 2026) ~42 EECU-hours.
  budget:
    monthly_limit_eecu_hours: 150
    alert_threshold_pct: 80
    task_soft_cap_eecu_hours: 10   # ask the human before any single task exceeds this
