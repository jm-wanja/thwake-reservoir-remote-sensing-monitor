name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before dependencies are installed, so the checkout holds only tracked files.
      - name: Fail on files larger than 10 MB
        run: |
          large=$(find . -path ./.git -prune -o -type f -size +10M -print)
          if [ -n "$large" ]; then
            echo "::error::Files over 10 MB must not be committed (AGENTS.md §5.3):"
            echo "$large"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
