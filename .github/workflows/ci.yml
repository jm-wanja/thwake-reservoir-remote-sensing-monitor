name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot proposes updates.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Runs before dependencies are installed, so the checkout holds only tracked files.
      - name: Fail on files larger than 10 MB
        run: |
          large=$(find . -path ./.git -prune -o -type f -size +10M -print)
          if [ -n "$large" ]; then
            echo "::error::Files over 10 MB must not be committed (AGENTS.md §5.3):"
            echo "$large"
            exit 1
          fi

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test (with coverage; includes agent-guardrail tests)
        run: uv run pytest
