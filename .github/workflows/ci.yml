name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (supply-chain safety); Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs before dependencies are installed, so the checkout holds only tracked files.
      - name: Fail on files larger than 10 MB
        run: |
          large=$(find . -path ./.git -prune -o -type f -size +10M -print)
          if [ -n "$large" ]; then
            echo "::error::Files over 10 MB must not be committed (AGENTS.md §5.3):"
            echo "$large"
            exit 1
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test (with coverage; includes agent-guardrail tests)
        run: uv run pytest
